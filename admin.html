<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Inferno IPTV – Statistik</title>
<style>
  :root { --bg: #0b0c10; --s1: #15171d; --s2: #1e2129; --line: #2a2e38; --tx: #f2f3f5; --tx2: #a7adba; --tx3: #6f7685; --ac: #ff5a1f; --ok: #3ccf7a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--tx); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 16px 60px; }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; flex-wrap: wrap; }
  header h1 { font-size: 26px; margin: 0; letter-spacing: -.3px; flex: 1; }
  header h1 span { color: var(--ac); }
  .btn { background: var(--s2); color: var(--tx); border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; font: inherit; cursor: pointer; }
  .btn:hover { border-color: var(--tx3); }
  .btn.primary { background: var(--ac); border-color: var(--ac); color: #fff; font-weight: 600; }
  .login { max-width: 380px; margin: 12vh auto 0; background: var(--s1); border: 1px solid var(--line); border-radius: 18px; padding: 30px; }
  .login h2 { margin: 0 0 6px; font-size: 22px; }
  .login h2 span { color: var(--ac); }
  .login p { margin: 0 0 20px; color: var(--tx2); }
  label { display: block; font-size: 13px; color: var(--tx2); margin: 12px 0 6px; }
  input { width: 100%; background: var(--bg); color: var(--tx); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; font: inherit; }
  input:focus { outline: none; border-color: var(--ac); }
  .login .btn { width: 100%; margin-top: 20px; padding: 12px; }
  .err { color: #ff8a8d; margin-top: 12px; min-height: 20px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 26px; }
  .stat { background: var(--s1); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
  .stat b { display: block; font-size: 32px; letter-spacing: -.5px; }
  .stat span { color: var(--tx2); font-size: 13px; }
  h3.sec { font-size: 15px; color: var(--tx2); text-transform: uppercase; letter-spacing: 1.2px; margin: 26px 0 12px; }
  .bars { background: var(--s1); border: 1px solid var(--line); border-radius: 14px; padding: 8px 18px; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .bar:first-child { border-top: none; }
  .bar .k { width: 120px; flex: 0 0 auto; color: var(--tx2); font-size: 14px; }
  .bar .track { flex: 1; height: 10px; background: var(--s2); border-radius: 6px; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--ac); border-radius: 6px; }
  .bar .v { width: 54px; flex: 0 0 auto; text-align: right; font-variant-numeric: tabular-nums; }
  .empty { text-align: center; color: var(--tx2); padding: 50px 10px; background: var(--s1); border: 1px dashed var(--line); border-radius: 14px; }
  .foot { margin-top: 26px; color: var(--tx3); font-size: 12.5px; }
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script>
'use strict';
/* Anonyme Nutzungsstatistik für den Inhaber. Daten liegen in Supabase; lesen darf nur, wer in „admins“ steht.
   Es gibt hier keine Playlists, Zugangsdaten, Namen oder Standorte – nur anonyme Summen. */
const URL_ = 'https://rpmgklwklawuqrbsyahu.supabase.co';
const KEY = 'sb_publishable_IEG2-fZ-w-Nj5UCaN7W9cw_8xMl8Q3C';
const root = document.getElementById('root');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let sess = null, rows = [];
try { sess = JSON.parse(localStorage.getItem('inferno-admin') || 'null'); } catch (e) { sess = null; }
const save = () => { try { if (sess) localStorage.setItem('inferno-admin', JSON.stringify(sess)); else localStorage.removeItem('inferno-admin'); } catch (e) { /* egal */ } };

async function auth(body, grant) {
  const r = await fetch(URL_ + '/auth/v1/token?grant_type=' + grant, { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error_description || j.msg || j.message || 'Anmeldung fehlgeschlagen');
  sess = { at: j.access_token, rt: j.refresh_token, exp: Date.now() + (j.expires_in || 3600) * 1000, email: (j.user && j.user.email) || '' };
  save();
}
async function token() {
  if (sess && Date.now() > sess.exp - 60000) {
    try { await auth({ refresh_token: sess.rt }, 'refresh_token'); } catch (e) { sess = null; save(); }
  }
  return sess && sess.at;
}
async function api(path) {
  const t = await token();
  if (!t) throw new Error('abgemeldet');
  const r = await fetch(URL_ + '/rest/v1/' + path, { headers: { apikey: KEY, Authorization: 'Bearer ' + t } });
  if (r.status === 401) { sess = null; save(); throw new Error('abgemeldet'); }
  if (!r.ok) throw new Error('Fehler ' + r.status);
  return r.json();
}

function loginView(msg) {
  root.innerHTML = '<form class="login" id="lf"><h2>Inferno <span>IPTV</span></h2><p>Statistik – Anmeldung</p>' +
    '<label for="em">E-Mail</label><input id="em" type="email" autocomplete="username" required>' +
    '<label for="pw">Passwort</label><input id="pw" type="password" autocomplete="current-password" required>' +
    '<button class="btn primary" type="submit">Anmelden</button><div class="err" id="er">' + esc(msg || '') + '</div></form>';
  document.getElementById('lf').onsubmit = async e => {
    e.preventDefault();
    const er = document.getElementById('er'); er.textContent = '';
    try { await auth({ email: document.getElementById('em').value.trim(), password: document.getElementById('pw').value }, 'password'); load(); }
    catch (x) { er.textContent = /invalid/i.test(x.message) ? 'E-Mail oder Passwort falsch.' : x.message; }
  };
}

const hours = s => {
  const h = (s || 0) / 3600;
  if (h < 1) return Math.round((s || 0) / 60) + ' Min.';
  if (h < 100) return h.toFixed(1).replace('.', ',') + ' Std.';
  return Math.round(h).toLocaleString('de-DE') + ' Std.';
};
function barList(map, total) {
  const keys = Object.keys(map).sort((a, b) => map[b] - map[a]);
  if (!keys.length) return '<div class="bar"><span class="k">–</span></div>';
  return keys.map(k => '<div class="bar"><span class="k">' + esc(k) + '</span><span class="track"><span class="fill" style="width:' +
    (total ? Math.round(map[k] / total * 100) : 0) + '%"></span></span><span class="v">' + map[k] + '</span></div>').join('');
}

function render() {
  const now = Date.now(), day = 86400000;
  const active7 = rows.filter(d => now - new Date(d.last_seen) < 7 * day).length;
  const active1 = rows.filter(d => now - new Date(d.last_seen) < day).length;
  const watch = rows.reduce((n, d) => n + (+d.watch_secs || 0), 0);
  const byPlat = {}, byVer = {};
  rows.forEach(d => {
    const p = d.platform === 'tv' ? 'Fernseher' : d.platform === 'pc' ? 'Windows-PC' : 'Unbekannt';
    byPlat[p] = (byPlat[p] || 0) + 1;
    byVer['v' + (d.version || '?')] = (byVer['v' + (d.version || '?')] || 0) + 1;
  });
  root.innerHTML =
    '<header><h1>Inferno <span>IPTV</span> · Statistik</h1><button class="btn" id="rl">Aktualisieren</button><button class="btn" id="lo">Abmelden</button></header>' +
    (rows.length ? '<div class="stats">' +
      '<div class="stat"><b>' + rows.length + '</b><span>Installationen insgesamt</span></div>' +
      '<div class="stat"><b>' + active7 + '</b><span>aktiv (7 Tage)</span></div>' +
      '<div class="stat"><b>' + active1 + '</b><span>aktiv (heute)</span></div>' +
      '<div class="stat"><b>' + hours(watch) + '</b><span>Wiedergabe gesamt</span></div>' +
      '<div class="stat"><b>' + hours(rows.length ? watch / rows.length : 0) + '</b><span>⌀ pro Installation</span></div>' +
    '</div>' +
    '<h3 class="sec">Plattform</h3><div class="bars">' + barList(byPlat, rows.length) + '</div>' +
    '<h3 class="sec">App-Version</h3><div class="bars">' + barList(byVer, rows.length) + '</div>'
    : '<div class="empty">Noch keine Daten. Sobald jemand die App (ab 1.26.0) öffnet und zustimmt, erscheinen hier anonyme Summen.</div>') +
    '<div class="foot">Angemeldet als ' + esc(sess && sess.email) + '. Erfasst werden nur anonyme Werte: zufällige Installations-Kennung, Plattform, Version und Wiedergabedauer – keine Playlists, Zugangsdaten, Namen oder Standorte.</div>';
  document.getElementById('rl').onclick = load;
  document.getElementById('lo').onclick = () => { sess = null; save(); loginView(); };
}

async function load() {
  if (!sess) return loginView();
  try {
    rows = await api('installs?select=id,platform,version,watch_secs,opens,first_seen,last_seen&order=last_seen.desc');
    if (!rows.length) {
      const me = await api('admins?select=email');
      if (!me.length) return loginView('Dieses Konto ist nicht als Admin eingetragen (Tabelle „admins“ in Supabase).');
    }
    render();
  } catch (x) { loginView(x.message === 'abgemeldet' ? 'Bitte erneut anmelden.' : x.message); }
}
load();
</script>
</body>
</html>
